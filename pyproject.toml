[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-redis-ratelimiter"
version = "0.2.0"
description = "A distributed Redis-backed rate limiter plugin for FastAPI and Django."
authors = [
    {name = "Himanshu", email = "developer@example.com"}
]
dependencies = [
    "redis>=4.2.0"
]
optional-dependencies.fastapi = ["fastapi>=0.68.0"]
optional-dependencies.django = ["django>=3.2"]
readme = "README.md"
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/himanshukaushal123/universal-redis-ratelimiter"
